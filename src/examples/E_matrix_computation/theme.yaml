colors:
  primary: "#1f497d"
  secondary: "#2563eb"
  neutral: "#64748b"
  text: "#0f172a"
  background: "#ffffff"
  
  # Panels & Containers
  panel_bg: "#f8fafc"
  panel_border: "#cbd5e1"
  panel_header: "#1e293b"
  
  # Matrix & Thematic Accents
  v_matrix: "#0f766e"        # Teal for Document-Term Matrix V / TF-IDF
  v_light: "#ccfbf1"
  w_matrix: "#1d4ed8"        # Blue for Topic Matrix W (Words x Topics)
  w_light: "#dbeafe"
  h_matrix: "#7c3aed"        # Purple for Coefficient Matrix H (Topics x Docs)
  h_light: "#ede9fe"
  calc_highlight: "#ea580c"  # Orange for active row/col dot product
  calc_light: "#ffedd5"
  sparse_zero: "#f1f5f9"     # Light gray for zero sparse cells
  dist_line: "#475569"
  lda_accent: "#b45309"      # Amber for LDA Bayesian variables
  lda_light: "#fef3c7"

fonts:
  sans:  { family: "Helvetica" }
  serif: { family: "Times New Roman" }
  mono:  { family: "Courier New" }
default_font: sans

sizes:
  title: 17
  heading: 13
  subheading: 11
  body: 10
  label: 9
  small: 8
  caption: 9.5
  eq_large: 16
  eq_term: 14
  eq_small: 12

line_height: 1.25

strokes:
  hairline: 0.75
  thin: 1
  normal: 1.5
  thick: 2
  heavy: 3

opacity:
  wash: 10
  tint: 25
  soft: 45
  faded: 35

shape:
  corner_radius: 6
