name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fonts (metric-compatible Helvetica/Times for text measurement)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Bundle is in sync with src/
        run: python tools/build_bundle.py --check
      - name: Smoke tests
        run: pytest -q -rA --tb=long

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: tidyfigs-skill
          path: dist/tidyfigs.zip
